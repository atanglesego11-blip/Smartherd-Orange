<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartHerd — live tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  :root{
    --bg:#0f1418; --panel:#182027; --line:#2b3740; --dim:#8b9aa5; --text:#e9eef2;
    --live:#3ddc84; --stale:#f0b429; --dead:#e5484d; --accent:#4ea3d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0;background:#0b1013}
  .card{
    position:absolute;top:14px;left:14px;z-index:1000;width:308px;
    max-height:calc(100% - 28px);overflow:auto;
    background:rgba(24,32,39,.95);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;backdrop-filter:blur(8px);
  }
  .name{font-size:16px;font-weight:600;margin:0 0 2px}
  .sub{font-size:12px;color:var(--dim);margin:0 0 12px}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
  .dot.live{background:var(--live);box-shadow:0 0 0 4px rgba(61,220,132,.16)}
  .dot.stale{background:var(--stale)}
  .dot.dead{background:var(--dead)}
  .linkline{display:flex;align-items:center;gap:7px;font-size:11.5px;
    color:var(--dim);margin-bottom:13px;padding-left:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px 12px;font-size:12.5px}
  .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .v{font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-all}
  .big{font-size:15px;font-weight:600}
  .foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between}
  .btns{display:flex;gap:7px;margin-top:13px}
  .btn{flex:1;text-align:center;font-size:11.5px;color:var(--accent);
    text-decoration:none;border:1px solid var(--line);border-radius:8px;
    padding:7px 9px;cursor:pointer;background:none;font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .leaflet-popup-content{font-size:12.5px}
</style>
</head>
<body>
<div id="map"></div>

<div class="card">
  <p class="name" id="animal">Waiting…</p>
  <p class="sub" id="device">—</p>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Connecting…</span>
  </div>

  <div class="linkline">
    <span id="linkIcon">○</span>
    <span id="linkText">Wi-Fi → HTTPS → Supabase</span>
  </div>

  <div class="grid">
    <div><div class="k">Last fix</div><div class="v big" id="age">—</div></div>
    <div><div class="k">Local time</div><div class="v" id="localTime">—</div></div>

    <div><div class="k">Speed</div><div class="v" id="speed">—</div></div>
    <div><div class="k">Satellites</div><div class="v" id="sats">—</div></div>

    <div><div class="k">Latitude</div><div class="v" id="lat">—</div></div>
    <div><div class="k">Longitude</div><div class="v" id="lng">—</div></div>

    <div><div class="k">Collar</div><div class="v" id="collar">—</div></div>
    <div><div class="k">Link</div><div class="v" id="link">Wi-Fi</div></div>

    <div><div class="k">Altitude</div><div class="v" id="alt">—</div></div>
    <div><div class="k">Course</div><div class="v" id="course">—</div></div>
  </div>

  <div class="btns">
    <button class="btn" id="follow">Follow</button>
    <button class="btn" id="whole">Whole country</button>
  </div>

  <div class="foot">
    <span id="count">0 fixes</span>
    <span id="farm">—</span>
  </div>
</div>

const BOTSWANA = L.latLngBounds(
  L.latLng(-26.95, 19.95),   // south-west

  zoomControl: true,

  maxBoundsViscosity: 1.0,   // hard edge: dragging past the border springs back

}).fitBounds(BOTSWANA);

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

).addTo(map);

  color: '#4ea3d8', weight: 1, opacity: .35, fill: false, dashArray: '6 6',
  interactive: false,
}).addTo(map);

$('collar').textContent = DEVICE_ID;
$('link').textContent = LINK_TYPE;

// `commit_timestamp` is Postgres's replication clock - when the row hit disk,
// not when the animal was there. `ts` is the GNSS fix time, stored UTC and
// shown in Africa/Gaborone.
const fmtLocal = (iso) => new Date(iso).toLocaleTimeString('en-GB', {
  timeZone: 'Africa/Gaborone', hour: '2-digit', minute: '2-digit', second: '2-digit',
});

function ago(iso) {
  const s = Math.max(1, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 10) return 'just now';
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function render(row, { recentre = false } = {}) {
  latest = row;
  const pos = [row.lat, row.lon];   // column is `lon`; Leaflet wants [lat, lng]

  if (!marker) {
    marker = L.marker(pos, { icon: goatIcon }).addTo(map);
  } else {
    marker.setLatLng(pos);
  }
  marker.bindPopup(
    `<b>${row.animal_name ?? DEVICE_ID}</b><br>${fmtLocal(row.ts)}<br>` +
    `${Math.abs(row.lat).toFixed(6)} ${row.lat < 0 ? 'S' : 'N'}, ` +
    `${Math.abs(row.lon).toFixed(6)} ${row.lon < 0 ? 'W' : 'E'}`
  );

  $('animal').textContent = row.animal_name ?? 'Unknown animal';
  $('device').textContent = `${row.device_id} · ${row.animal_type ?? ''} · ${LINK_TYPE}`;
  $('localTime').textContent = fmtLocal(row.ts);
  $('speed').textContent  = `${(row.speed ?? 0).toFixed(1)} km/h`;
  $('sats').textContent   = row.sats ?? '—';
  // Shown with a compass letter as well as the sign, so a wrong hemisphere is
  // obvious at a glance rather than hiding in a minus sign.
  $('lat').textContent    = `${Math.abs(row.lat).toFixed(6)} ${row.lat < 0 ? 'S' : 'N'}`;
  $('lng').textContent    = `${Math.abs(row.lon).toFixed(6)} ${row.lon < 0 ? 'W' : 'E'}`;
  $('collar').textContent = row.device_id;
  $('alt').textContent    = row.alt != null ? `${Math.round(row.alt)} m` : '—';
  $('course').textContent = row.course != null ? `${Math.round(row.course)}°` : '—';
  $('farm').textContent   = row.farm_id ? `farm ${row.farm_id.slice(0, 8)}…` : '—';

  if ((recentre || following) && BOTSWANA.contains(pos)) {
    map.setView(pos, Math.max(map.getZoom(), 15));
  }
  tick();
}

// Re-run every second so a stale position can never look current.
function tick() {
  if (!latest) return;
  const s = (Date.now() - new Date(latest.ts).getTime()) / 1000;
  $('age').textContent = ago(latest.ts);
  $('dot').className = 'dot ' + (s < STALE_AFTER ? 'live' : s < DEAD_AFTER ? 'stale' : 'dead');
  $('statusText').textContent = s < STALE_AFTER ? 'GPS live'
                              : s < DEAD_AFTER  ? 'Delayed — no recent fix'
                              : 'No signal from collar';
}
setInterval(tick, 1000);

// Dragging the map means the user wants to look somewhere; stop yanking the
// view back on the next fix until they ask for it again.
map.on('dragstart', () => { following = false; $('follow').textContent = 'Follow'; });
$('follow').onclick = () => {
  following = true;
  $('follow').textContent = 'Following';
  if (latest) map.setView([latest.lat, latest.lon], Math.max(map.getZoom(), 15));
};
$('whole').onclick = () => {
  following = false;
  $('follow').textContent = 'Follow';
  map.fitBounds(BOTSWANA);
};

// ---------------------------------------------------------------------------
// 1. Load history so the map is populated straight away.
// ---------------------------------------------------------------------------
const { data: history } = await supabase
  .from('gps_readings')
  .select('*')
  .eq('device_id', DEVICE_ID)
  .order('ts', { ascending: false })
  .limit(TRAIL_POINTS);

if (history?.length) {
  // Only plot points inside the country. A stray reading from a bad fix would
  // otherwise stretch fitBounds across two continents and zoom out to nothing.
  const asc = history.slice().reverse()
    .filter(r => BOTSWANA.contains([r.lat, r.lon]));

  total = history.length;
  $('count').textContent = `${total} fixes`;

  if (asc.length) {
    trail.setLatLngs(asc.map(r => [r.lat, r.lon]));
    render(asc[asc.length - 1], { recentre: true });
    map.fitBounds(trail.getBounds(), { padding: [60, 60], maxZoom: 17 });
  }
}

// ---------------------------------------------------------------------------
// 2. Subscribe. The page joins the channel itself on load, so there is no
//    Realtime Inspector to configure by hand.
// ---------------------------------------------------------------------------
supabase
  .channel('gps-live')
  .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'gps_readings',
        filter: `device_id=eq.${DEVICE_ID}` },
      ({ new: row }) => {
        total++;
        $('count').textContent = `${total} fixes`;
        if (BOTSWANA.contains([row.lat, row.lon])) {
          trail.addLatLng([row.lat, row.lon]);
          const pts = trail.getLatLngs();
          if (pts.length > TRAIL_POINTS) trail.setLatLngs(pts.slice(-TRAIL_POINTS));
        }
        render(row);
      })
  .subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      $('linkIcon').textContent = '●';
      $('linkText').textContent = `${LINK_TYPE} → HTTPS → Supabase · listening`;
      if (!latest) $('statusText').textContent = 'Listening — waiting for first fix';
    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
      $('linkIcon').textContent = '○';
      $('linkText').textContent = 'Realtime disconnected — retrying…';
    }
    // supabase-js reconnects on its own.
  });
</script>
</body>
</html>
